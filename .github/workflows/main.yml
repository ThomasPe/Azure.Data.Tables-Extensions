# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  mainProj: 'Medienstudio.Azure.Data.Tables.Extensions'
  testProj: 'Medienstudio.Azure.Data.Tables.Extensions.Tests'
  mainCSVProj: 'Medienstudio.Azure.Data.Tables.CSV'
  testCSVProj: 'Medienstudio.Azure.Data.Tables.CSV.Tests'
  buildPlatform: Any CPU
  buildConfiguration: Release
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install & run Azurite
        run: npm install -g azurite
        # https://github.com/Azure/Azurite/issues/451#issuecomment-639398801
      - name: Run Azurite in Background
        shell: bash
        # --skipApiVersionCheck: Azurite lags the Azure.Storage.Blobs SDK's default request API
        # version, so a current SDK gets a hard 400 (InvalidHeaderValue) without this flag.
        run: azurite --skipApiVersionCheck &
      - name: Build Solution
        run: dotnet build src/${{ env.mainProj }}.sln -c Release
      - name: Test Extensions
        run: dotnet test src/${{ env.testProj }}/${{ env.testProj }}.csproj
      - name: Test CSV Extensions
        run: dotnet test src/${{ env.testCSVProj }}/${{ env.testCSVProj }}.csproj

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [build, release-please]
    if: ${{ always() && needs.build.result == 'success' && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Build packages
        run: |
          dotnet pack src/Medienstudio.Azure.Data.Tables.Extensions/Medienstudio.Azure.Data.Tables.Extensions.csproj -c Release -o artifacts
          dotnet pack src/Medienstudio.Azure.Data.Tables.CSV/Medienstudio.Azure.Data.Tables.CSV.csproj -c Release -o artifacts
      - name: NuGet Login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ThomasP
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
